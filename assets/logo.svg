<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="airGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="airGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing ambient ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#airGrad1)" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 6" />

  <!-- Air streamline 1 (Top) -->
  <path d="M 22 36 C 36 36 42 26 56 26 C 68 26 74 34 74 40 C 74 46 66 50 60 48 C 54 46 54 40 60 38" 
        stroke="url(#airGrad2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- Air streamline 2 (Middle) -->
  <path d="M 16 52 C 34 52 44 48 58 48 C 76 48 84 58 82 68 C 80 76 70 80 62 76 C 54 72 56 64 64 62" 
        stroke="url(#airGrad1)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- Air streamline 3 (Bottom) -->
  <path d="M 24 68 C 34 68 40 64 48 64 C 54 64 58 66 60 70" 
        stroke="url(#airGrad2)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Small accent dots -->
  <circle cx="20" cy="36" r="3.5" fill="#38bdf8" />
  <circle cx="14" cy="52" r="4" fill="#06b6d4" />
  <circle cx="22" cy="68" r="3" fill="#10b981" />
</svg>

